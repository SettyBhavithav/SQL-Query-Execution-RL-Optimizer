services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: sqlopt
      POSTGRES_PASSWORD: sqlopt
      POSTGRES_DB: sqlopt
    ports:
      - "55432:5432"
    volumes:
      - sqlopt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlopt -d sqlopt"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  sqlopt-pgdata:
